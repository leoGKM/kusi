
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kusi — Diagnóstico Etapa 1 v2</title>

  <!-- Intercepción preventiva de audio -->
  <script>
    (function() {
      window.__arAudioContexts = [];
      const NativeAudioContext = window.AudioContext || window.webkitAudioContext;

      if (NativeAudioContext) {
        function OverriddenAudioContext(...args) {
          const ctx = new NativeAudioContext(...args);
          window.__arAudioContexts.push(ctx);

          if (ctx.state === 'running') {
            ctx.suspend().catch(() => {});
          }

          return ctx;
        }

        OverriddenAudioContext.prototype = NativeAudioContext.prototype;
        window.AudioContext = OverriddenAudioContext;

        if (window.webkitAudioContext) {
          window.webkitAudioContext = OverriddenAudioContext;
        }
      }
    })();
  </script>

  <!-- Runtimes originales de 8th Wall -->
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js"
          data-preload-chunks="face, slam"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #ar-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(40, 46, 62, 0.85);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.3s ease;
    }

    #kusi-diagnostic {
      position: fixed;
      bottom: 8px;
      left: 8px;
      right: 8px;
      z-index: 9999;
      background: rgba(0,0,0,.88);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font: 12px/1.45 monospace;
      max-height: 35vh;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div id="ar-overlay">
    📷 Apunta la cámara a una de las tarjetas de Kusi
  </div>

  <div id="kusi-diagnostic" aria-live="polite">
    Preparando diagnóstico…
  </div>

  <!-- Instrumentación del motor XR -->
  <script>
    (() => {
      const panel = document.getElementById('kusi-diagnostic');
      const lines = [];

      const log = (message) => {
        const time = (performance.now() / 1000).toFixed(1);

        lines.push(
          `[${time}s] ${String(message).slice(0,250)}`
        );

        panel.textContent = lines.slice(-18).join('\n');

        console.info('[KUSI-DIAG]', message);
      };

      window.__kusiDiagnosticLog = log;

      log(
        'HTTPS=' + isSecureContext +
        ' camaraAPI=' +
        !!navigator.mediaDevices?.getUserMedia
      );

      log(
        'XR8=' + typeof window.XR8 +
        ' ecs=' + typeof window.ecs
      );

      const brief = (x) => {
        try {
          if (x === undefined) return 'undefined';
          if (x === null) return 'null';

          if (typeof x !== 'object') {
            return String(x).slice(0,80);
          }

          return JSON.stringify(x, (key, val) => {
            if (
              key === 'imageTargetData' &&
              Array.isArray(val)
            ) {
              return `[${val.length} targets]`;
            }

            if (typeof val === 'function') {
              return '[function]';
            }

            return val;
          }).slice(0,400);

        } catch {
          return '[objeto no serializable]';
        }
      };

      const wrap = (obj, name, label) => {
        if (!obj || typeof obj[name] !== 'function') {
          return log('No existe ' + label);
        }

        const original = obj[name];

        try {
          obj[name] = function(...args) {
            log(
              'LLAMADA ' + label +
              ' ' + brief(args[0])
            );

            try {
              const result = original.apply(this, args);

              if (
                result &&
                typeof result.catch === 'function'
              ) {
                result.catch(e => {
                  log(
                    'RECHAZO ' + label +
                    ': ' + (e?.message || e)
                  );
                });
              }

              return result;

            } catch(e) {
              log(
                'EXCEPCION ' + label +
                ': ' + (e?.message || e)
              );

              throw e;
            }
          };

          log('Observando ' + label);

        } catch(e) {
          log(
            'No se pudo observar ' +
            label + ': ' + e.message
          );
        }
      };

      wrap(
        window.XR8,
        'run',
        'XR8.run'
      );

      wrap(
        window.XR8,
        'reconfigureSession',
        'XR8.reconfigureSession'
      );

      wrap(
        window.XR8?.XrController,
        'configure',
        'XR8.XrController.configure'
      );

      window.addEventListener(
        'error',
        e => log(
          'ERROR: ' +
          (e.message || e.target?.src || 'desconocido')
        ),
        true
      );

      window.addEventListener(
        'unhandledrejection',
        e => log(
          'PROMESA: ' +
          (e.reason?.message || String(e.reason))
        )
      );

      const oldError = console.error;

      console.error = function(...args) {
        log(
          'CONSOLA: ' +
          args.map(a => a?.message || String(a))
              .join(' ')
              .slice(0,200)
        );

        return oldError.apply(this,args);
      };

      for (const eventName of [
        'xr-image-target-found',
        'targetfound',
        'xrimagefound',
        'xr:xrimagefound'
      ]) {
        window.addEventListener(
          eventName,
          e => log(
            'TARGET FOUND ' +
            eventName + ' ' +
            brief(e.detail)
          )
        );
      }

      log('Iniciando bundle.js');

      setTimeout(
        () => log(
          'ESTADO 10s XR8=' +
          typeof window.XR8 +
          ' XR8.run=' +
          typeof window.XR8?.run
        ),
        10000
      );

      setTimeout(
        () => log(
          'ESTADO 30s XR8=' +
          typeof window.XR8 +
          ' XR8.run=' +
          typeof window.XR8?.run
        ),
        30000
      );

    })();
  </script>

  <!-- Escena original de Kusi -->
  <script src="./bundle.js"></script>

  <script>
    window.__kusiDiagnosticLog?.(
      'bundle.js terminado; XR8.run: ' +
      typeof window.XR8?.run
    );
  </script>

  <!-- Control de audio original -->
  <script>
    (function() {
      let isTargetVisible = false;

      const overlayText =
        document.getElementById('ar-overlay');

      const muteAll = () => {
        if (window.__arAudioContexts) {
          window.__arAudioContexts.forEach(ctx => {
            if (ctx.state === 'running') {
              ctx.suspend().catch(() => {});
            }
          });
        }

        document.querySelectorAll('audio').forEach(a => {
          a.pause();
          a.currentTime = 0;
          a.muted = true;
        });
      };

      const unmuteAll = () => {
        if (window.__arAudioContexts) {
          window.__arAudioContexts.forEach(ctx => {
            if (ctx.state === 'suspended') {
              ctx.resume().catch(() => {});
            }
          });
        }

        document.querySelectorAll('audio').forEach(a => {
          a.muted = false;
          a.currentTime = 0;
          a.play().catch(() => {});
        });
      };

      const monitor = () => {
        if (!isTargetVisible) muteAll();
        requestAnimationFrame(monitor);
      };

      requestAnimationFrame(monitor);

      const onTargetFound = (e) => {
        isTargetVisible = true;

        const name =
          (e.detail && e.detail.name)
          ? e.detail.name
          : '';

        if (overlayText) {
          overlayText.innerText = name
            ? `✨ ¡Tarjeta ${name} detectada!`
            : '✨ ¡Tarjeta detectada!';

          overlayText.style.background =
            'rgba(46, 125, 50, 0.9)';
        }

        unmuteAll();
      };

      const onTargetLost = () => {
        isTargetVisible = false;

        if (overlayText) {
          overlayText.innerText =
            '📷 Apunta la cámara a una de las tarjetas de Kusi';

          overlayText.style.background =
            'rgba(40, 46, 62, 0.85)';
        }

        muteAll();
      };

      const eventsFound = [
        'xr-image-target-found',
        'targetfound',
        'xrimagefound',
        'xr:xrimagefound'
      ];

      const eventsLost = [
        'xr-image-target-lost',
        'targetlost',
        'xrimagelost',
        'xr:xrimagelost'
      ];

      eventsFound.forEach(evt => {
        window.addEventListener(evt, onTargetFound);
      });

      eventsLost.forEach(evt => {
        window.addEventListener(evt, onTargetLost);
      });

    })();
  </script>

</body>
</html>
