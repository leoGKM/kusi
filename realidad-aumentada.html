<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kusi — Visor de Realidad Aumentada</title>
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam"></script>
</head>
<body style="margin:0; padding:0; overflow:hidden;">
  <script src="bundle.js"></script>

  <script>
    (function() {
      let cardDetected = false;

      // Función para silenciar forzadamente cualquier elemento <audio>
      const muteAudioElement = (audio) => {
        if (!cardDetected) {
          audio.muted = true;
          audio.pause();
          audio.currentTime = 0;
        }
      };

      // 1. Vigilante del DOM (MutationObserver): Detecta cuando 8th Wall inserta el <audio>
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          mutation.addedNodes.forEach((node) => {
            if (node.tagName === 'AUDIO') {
              muteAudioElement(node);
            } else if (node.querySelectorAll) {
              node.querySelectorAll('audio').forEach(muteAudioElement);
            }
          });
        });
      });

      observer.observe(document.documentElement, {
        childList: true,
        subtree: true
      });

      // 2. Evento: Tarjeta detectada -> Desmutear y reproducir
      const onTargetFound = () => {
        cardDetected = true;
        const audios = document.querySelectorAll('audio');
        audios.forEach((audio) => {
          audio.muted = false;
          audio.currentTime = 0;
          audio.play().catch(e => console.log("Audio esperando interacción:", e));
        });
      };

      // 3. Evento: Tarjeta perdida -> Mutear y pausar
      const onTargetLost = () => {
        cardDetected = false;
        const audios = document.querySelectorAll('audio');
        audios.forEach((audio) => {
          audio.muted = true;
          audio.pause();
          audio.currentTime = 0;
        });
      };

      // Escuchar los eventos del motor de Realidad Aumentada
      window.addEventListener('xr-image-target-found', onTargetFound);
      window.addEventListener('targetfound', onTargetFound);
      window.addEventListener('xr-image-target-lost', onTargetLost);
      window.addEventListener('targetlost', onTargetLost);
    })();
  </script>
</body>
</html>
