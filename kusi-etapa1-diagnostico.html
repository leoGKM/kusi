<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kusi — Visor RA</title>

  <!-- 1. Intercepción preventiva de audio (para que no suenen solos al inicio) -->
  <script>
    (function() {
      window.__arAudioContexts = [];
      const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
      if (NativeAudioContext) {
        function OverriddenAudioContext(...args) {
          const ctx = new NativeAudioContext(...args);
          window.__arAudioContexts.push(ctx);
          if (ctx.state === 'running') ctx.suspend().catch(() => {});
          return ctx;
        }
        OverriddenAudioContext.prototype = NativeAudioContext.prototype;
        window.AudioContext = OverriddenAudioContext;
        if (window.webkitAudioContext) window.webkitAudioContext = OverriddenAudioContext;
      }
    })();
  </script>

  <!-- 2. Runtimes originales de 8th Wall con sus atributos requeridos -->
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" data-preload-chunks="face, slam"></script>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #000; 
      font-family: system-ui, -apple-system, sans-serif; 
    }
    #ar-overlay {
      position: absolute; 
      top: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      z-index: 10;
      background: rgba(40, 46, 62, 0.85); 
      color: #fff; 
      padding: 12px 24px; 
      border-radius: 50px;
      font-size: 14px; 
      font-weight: 600; 
      text-align: center; 
      pointer-events: none; 
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>

  <div id="ar-overlay">📷 Apunta la cámara a una de las tarjetas de Kusi</div>

  <!-- Diagnóstico temporal: no modifica XR8 ni los objetivos de imagen -->
  <div id="kusi-diagnostic" style="position:fixed;bottom:10px;left:10px;right:10px;z-index:9999;background:rgba(0,0,0,.86);color:#fff;padding:10px;border-radius:8px;font:12px/1.5 monospace;max-height:32vh;overflow:auto;pointer-events:none" aria-live="polite">Kusi diagnóstico: preparando visor…</div>
  <script>
    (function () {
      const panel = document.getElementById('kusi-diagnostic');
      const lines = [];
      const log = (message) => {
        lines.push(String(message).slice(0, 240));
        panel.textContent = lines.slice(-12).join('\n');
      };
      window.__kusiDiagnosticLog = log;
      log('Contexto seguro: ' + window.isSecureContext);
      log('Cámara API: ' + !!navigator.mediaDevices?.getUserMedia);
      log('XR8: ' + typeof window.XR8 + ' | XR8.run: ' + typeof window.XR8?.run);
      window.addEventListener('error', (event) => log('ERROR: ' + (event.message || event.target?.src || 'desconocido')));
      window.addEventListener('unhandledrejection', (event) => log('PROMESA: ' + (event.reason?.message || String(event.reason))));
      const originalError = console.error;
      console.error = function (...args) {
        log('CONSOLA: ' + args.map(x => x?.message || String(x)).join(' '));
        return originalError.apply(this, args);
      };
      log('Iniciando bundle.js…');
    })();
  </script>

  <!-- 3. Carga del bundle de 8th Wall -->
  <script src="./bundle.js"></script>

  <script>window.__kusiDiagnosticLog?.('bundle.js ejecutado; XR8.run: ' + typeof window.XR8?.run);</script>

  <!-- 4. Lógica de silencio/activación por detección de tarjeta -->
  <script>
    (function() {
      let isTargetVisible = false;
      const overlayText = document.getElementById('ar-overlay');

      const muteAll = () => {
        if (window.__arAudioContexts) {
          window.__arAudioContexts.forEach(ctx => { if (ctx.state === 'running') ctx.suspend().catch(() => {}); });
        }
        document.querySelectorAll('audio').forEach(a => { a.pause(); a.currentTime = 0; a.muted = true; });
      };

      const unmuteAll = () => {
        if (window.__arAudioContexts) {
          window.__arAudioContexts.forEach(ctx => { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); });
        }
        document.querySelectorAll('audio').forEach(a => { a.muted = false; a.currentTime = 0; a.play().catch(() => {}); });
      };

      // Bucle continuo para mantener silenciados los audios cuando no hay tarjeta
      const monitor = () => {
        if (!isTargetVisible) muteAll();
        requestAnimationFrame(monitor);
      };
      requestAnimationFrame(monitor);

      // Manejadores de eventos de las tarjetas
      const onTargetFound = (e) => {
        isTargetVisible = true;
        const name = (e.detail && e.detail.name) ? e.detail.name : '';
        if (overlayText) {
          overlayText.innerText = name ? `✨ ¡Tarjeta ${name} detectada!` : "✨ ¡Tarjeta detectada!";
          overlayText.style.background = "rgba(46, 125, 50, 0.9)";
        }
        unmuteAll();
      };

      const onTargetLost = () => {
        isTargetVisible = false;
        if (overlayText) {
          overlayText.innerText = "📷 Apunta la cámara a una de las tarjetas de Kusi";
          overlayText.style.background = "rgba(40, 46, 62, 0.85)";
        }
        muteAll();
      };

      const eventsFound = ['xr-image-target-found', 'targetfound', 'xrimagefound', 'xr:xrimagefound'];
      const eventsLost = ['xr-image-target-lost', 'targetlost', 'xrimagelost', 'xr:xrimagelost'];

      eventsFound.forEach(evt => window.addEventListener(evt, onTargetFound));
      eventsLost.forEach(evt => window.addEventListener(evt, onTargetLost));
    })();
  </script>
</body>
</html>
